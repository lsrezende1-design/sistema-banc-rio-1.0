<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sistema Bancário #1727</title>

    <script src="js/api.js" defer></script>
    <script src="js/validacao.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/auth.js"></script>
    <link href="style.css" rel="stylesheet" />

    <script>
      protegerPagina();
      carregarBoasVindas();
    </script>
  </head>
  <body>
    <div class="wrap">
      <!-- Sidebar -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h5 class="sidebar-title">Sistema</h5>
        </div>

        <div class="sidebar-body">
          <button
            type="button"
            class="btn"
            onclick="location.href = 'clientes.html'"
          >
            Gestão de Clientes
          </button>

          <button
            type="button"
            class="btn"
            onclick="location.href = 'contas.html'"
          >
            Gestão de Contas
          </button>

          <button
            type="button"
            class="btn"
            onclick="location.href = 'transacoes.html'"
          >
            Transações
          </button>

          <button
            type="button"
            class="btn"
            onclick="location.href = 'index.html'"
          >
            Home
          </button>

          <button id="logout" class="btn">Sair</button>
        </div>
      </div>

      <div id="content">
        <!-- Main -->
        <main id="main">
          <!-- Navbar -->
          <div class="navbar">
            <p id="boasVindas"></p>
          </div>
        </main>

        <!--
          Área utilizada para mensagens gerais de sucesso ou erro.
        -->
        <div id="area-mensagens" role="alert"></div>

        <!-- ========================================= -->
        <!-- CLIENTES                                  -->
        <!-- ========================================= -->

        <section id="box1">
          <article class="card">
            <h2>Clientes</h2>

            <form id="form-cliente" novalidate>
              <label for="cliente-nome">Nome</label>

              <input type="text" id="cliente-nome" required />

              <label for="cliente-cpf">CPF</label>

              <input type="text" id="cliente-cpf" maxlength="11" required />

              <label for="cliente-email">Email</label>

              <input type="email" id="cliente-email" required />

              <p id="erro-cliente" role="alert"></p>

              <button type="submit">Salvar cliente</button>

              <button type="button" id="btn-cancelar">Cancelar</button>
            </form>
          </article>

          <!-- --
      FILTRO por nome
      -->
          <article class="card">
            <label for="filtro-cliente-nome"> Buscar por nome </label>

            <input type="search" id="filtro-cliente-nome" />
          </article>

          <article class="card">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>CPF</th>
                  <th>Email</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-clientes-corpo"></tbody>
            </table>
            <p id="quantidade-clientes"></p>
          </article>
        </section>
      </div>
    </div>
  </body>
</html>
