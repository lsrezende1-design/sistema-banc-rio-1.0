<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Bancário #1727</title>

    <script src="js/api.js" defer></script>
    <script src="js/validacao.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/auth.js"></script>
    <script src="js/alternarTema.js" defer></script>
    <script src="js/contas.js" defer></script>

    <link href="style.css" rel="stylesheet" />

    <script>
      protegerPagina();
      carregarBoasVindas();
    </script>
  </head>

  <body>
    <div class="wrap">
      <!-- Sidebar -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h5 class="sidebar-title">Sistema</h5>
        </div>
        <div class="sidebar-body">
          <button
            type="button"
            class="btn"
            onclick="location.href = 'clientes.html'"
          >
            Gestão de Clientes
          </button>
          <button
            type="button"
            class="btn"
            onclick="location.href = 'contas.html'"
          >
            Gestão de Contas
          </button>
          <button
            type="button"
            class="btn"
            onclick="location.href = 'transacoes.html'"
          >
            Transações
          </button>

          <button
            type="button"
            class="btn"
            onclick="location.href = 'index.html'"
          >
            Home
          </button>

          <button id="logout" class="btn">Sair</button>
        </div>
      </div>

      <div id="content">
        <!-- Main -->
        <main id="main">
          <!-- Navbar -->
          <div class="navbar">
            <p id="boasVindas"></p>
            <button id="btn-tema" type="button">Alternar Tema</button>
          </div>
        </main>

        <!-- Área utilizada para mensagens gerais de sucesso ou erro -->
        <div id="area-mensagens" role="alert"></div>

        <!-- ========================================= -->
        <!-- CONTAS                                    -->
        <!-- ========================================= -->
        <section id="box1">
          <article class="card">
            <h2>Contas</h2>

            <form id="form-conta">
              <label for="conta-cliente">Cliente</label>
              <select id="conta-cliente" required>
                <option value="">Selecione um cliente</option>
              </select>

              <label for="conta-tipo">Tipo</label>
              <select id="conta-tipo">
                <option value="Corrente">Corrente</option>
                <option value="Poupança">Poupança</option>
              </select>

              <p class="saldo-info">Saldo inicial: R$ 0,00</p>

              <p id="erro-conta" role="alert"></p>

              <button type="submit">Salvar Conta</button>
            </form>
          </article>

          <!-- FILTROS DE BUSCA (NOME E NÚMERO DA CONTA) -->
          <article class="card card-filtros">
            <div class="filtro-grupo">
              <label for="filtro-conta-nome">Buscar por nome do cliente</label>
              <input
                type="search"
                id="filtro-conta-nome"
                placeholder="Digite o nome do cliente..."
              />
            </div>

            <div class="filtro-grupo">
              <label for="filtro-conta-numero"
                >Buscar por número da conta</label
              >
              <input
                type="search"
                id="filtro-conta-numero"
                placeholder="Digite o número da conta..."
              />
            </div>
          </article>

          <!-- TABELA DE CONTAS -->
          <article class="card">
            <table id="tabela-contas">
              <thead>
                <tr>
                  <th>Número</th>
                  <th>Cliente</th>
                  <th>Tipo</th>
                  <th>Saldo</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-contas-corpo"></tbody>
            </table>
          </article>
        </section>
      </div>
    </div>
  </body>
</html>
