<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestão de Clientes</title>

    <script src="js/api.js" defer></script>
    <script src="js/validacao.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/auth.js"></script>
    <link href="style.css" rel="stylesheet" />

    <script>
      protegerPagina();
      carregarBoasVindas();
    </script>
  </head>

  <body>
    <div class="wrap">
      <!-- Sidebar -->

      <div id="sidebar">
        <div class="sidebar-header">
          <h5 class="sidebar-title">Sistema</h5>
        </div>

        <div class="sidebar-body">
          <button
            type="button"
            class="btn"
            onclick="location.href = 'clientes.html'"
          >
            Gestão de Clientes
          </button>

          <button
            type="button"
            class="btn"
            onclick="location.href = 'contas.html'"
          >
            Gestão de Contas
          </button>

          <button
            type="button"
            class="btn"
            onclick="location.href = 'transacoes.html'"
          >
            Transações
          </button>

          <button id="logout" class="btn">Sair</button>
        </div>
      </div>

      <section id="content">
        <!-- Main -->

        <main id="main">
          <div class="navbar">
            <div>
              <p id="usuarioLogado">Painel de Clientes</p>

              <p id="boasVindas">Faça login para acessar o sistema</p>

              <button id="btn-tema" type="button">Alternar Tema</button>
            </div>
            <!-- Adicione o botão no topo do <body> (ex: antes do <h1>) -->

            <form id="loginForm">
              <input type="text" id="usuario" placeholder="Usuário" required />

              <input type="password" id="senha" placeholder="Senha" required />

              <button type="button" onclick="entrar(event)">Entrar</button>

              <p id="mensagem"></p>
            </form>
          </div>
        </main>

        <article id="Box">
          <h2>Sistema Bancário #1727</h2>

          <p>Bem-vindo ao sistema de gerenciamento bancário.</p>
        </article>
      </section>
    </div>
  </body>
</html>
